[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-registry"
version = "1.0.0"
description = "AI agent capability registry: human- and machine-readable agent cards, SKU catalog, continuous verification, REST API"
readme = "Readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # stdlib only

[project.scripts]
agent-registry = "cli:main"

[tool.setuptools]
packages = ["registry", "verifier", "api", "agents"]
py-modules = ["cli"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
